
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXCALC - Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08080c;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: #121218;
      border: 1px solid #292934;
      border-radius: 18px;
      padding: 25px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: 3px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 22px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #1b1b23;
      color: #aaa;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #7c5cff;
      color: white;
    }

    .group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #bbb;
      font-size: 13px;
    }

    input {
      display: block;
      width: 100%;
      height: 50px;

      padding: 12px;

      background: #09090d;
      color: white;

      border: 1px solid #34343e;
      border-radius: 9px;

      font-size: 16px;

      outline: none;

      /* Make sure typing is allowed */
      pointer-events: auto;
      user-select: text;
      -webkit-user-select: text;
    }

    input:focus {
      border-color: #7c5cff;
    }

    input::placeholder {
      color: #777;
    }

    button.submit {
      width: 100%;
      height: 50px;

      border: 0;
      border-radius: 9px;

      background: #7c5cff;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    button.submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 20px;
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }

    .success {
      color: #55d98b;
    }

    .error {
      color: #ff6868;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #999;
      text-decoration: none;
      font-size: 13px;
    }

    #registerForm {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>NEXCALC</h1>

    <div class="subtitle">
      Smart Calculator. Everything in one place.
    </div>


    <!-- TABS -->

    <div class="tabs">

      <button
        type="button"
        class="tab active"
        id="loginTab">
        Login
      </button>

      <button
        type="button"
        class="tab"
        id="registerTab">
        Register
      </button>

    </div>


    <!-- LOGIN -->

    <form id="loginForm">

      <div class="group">

        <label for="loginEmail">
          Email
        </label>

        <input
          id="loginEmail"
          type="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="group">

        <label for="loginPassword">
          Password
        </label>

        <input
          id="loginPassword"
          type="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>

      </div>


      <button
        type="submit"
        class="submit"
        id="loginBtn">
        Login
      </button>

    </form>


    <!-- REGISTER -->

    <form id="registerForm">

      <div class="group">

        <label for="registerName">
          Name
        </label>

        <input
          id="registerName"
          type="text"
          name="name"
          placeholder="Enter your name"
          autocomplete="name"
          required>

      </div>


      <div class="group">

        <label for="registerEmail">
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="group">

        <label for="registerPassword">
          Password
        </label>

        <input
          id="registerPassword"
          type="password"
          name="password"
          placeholder="Minimum 6 characters"
          autocomplete="new-password"
          minlength="6"
          required>

      </div>


      <button
        type="submit"
        class="submit"
        id="registerBtn">
        Create Account
      </button>

    </form>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message">
    </div>


    <a
      href="index.html"
      class="back">
      ← Back to NEXCALC
    </a>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { firebaseConfig }
      from "./firebase-config.js";


    // Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // Admin email

    const ADMIN_EMAIL = "sgdurga18@gmail.com";


    // Elements

    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const registerBtn =
      document.getElementById("registerBtn");

    const message =
      document.getElementById("message");


    // Message

    function showMessage(text, type = "") {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // Redirect

    function redirectUser(user) {

      if (!user) return;

      const email =
        (user.email || "").toLowerCase().trim();


      if (email === ADMIN_EMAIL.toLowerCase()) {

        window.location.href =
          "admin-dashboard.html";

      } else {

        window.location.href =
          "index.html";

      }

    }


    // LOGIN TAB

    loginTab.addEventListener("click", function () {

      loginTab.classList.add("active");

      registerTab.classList.remove("active");

      loginForm.style.display = "block";

      registerForm.style.display = "none";

      showMessage("");

      document.getElementById("loginEmail").focus();

    });


    // REGISTER TAB

    registerTab.addEventListener("click", function () {

      registerTab.classList.add("active");

      loginTab.classList.remove("active");

      loginForm.style.display = "none";

      registerForm.style.display = "block";

      showMessage("");

      document.getElementById("registerName").focus();

    });


    // LOGIN

    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();


      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      if (!email) {

        showMessage(
          "Please enter your email.",
          "error"
        );

        return;
      }


      if (!password) {

        showMessage(
          "Please enter your password.",
          "error"
        );

        return;
      }


      loginBtn.disabled = true;

      loginBtn.textContent = "Logging in...";

      showMessage("");


      try {

        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        showMessage(
          "Login successful!",
          "success"
        );


        setTimeout(function () {

          redirectUser(result.user);

        }, 500);


      } catch (error) {

        console.error(error);

        let msg =
          "Login failed. Please try again.";


        if (
          error.code === "auth/invalid-credential"
        ) {

          msg =
            "Incorrect email or password.";

        } else if (
          error.code === "auth/user-not-found"
        ) {

          msg =
            "No account found with this email.";

        } else if (
          error.code === "auth/wrong-password"
        ) {

          msg =
            "Incorrect password.";

        } else if (
          error.code === "auth/invalid-email"
        ) {

          msg =
            "Please enter a valid email.";

        } else if (
          error.code === "auth/too-many-requests"
        ) {

          msg =
            "Too many attempts. Try again later.";

        } else if (
          error.code === "auth/network-request-failed"
        ) {

          msg =
            "Network error. Check your internet.";

        }


        showMessage(msg, "error");

        loginBtn.disabled = false;

        loginBtn.textContent = "Login";

      }

    });


    // REGISTER

    registerForm.addEventListener("submit", async function (event) {

      event.preventDefault();


      const name =
        document.getElementById("registerName").value.trim();

      const email =
        document.getElementById("registerEmail").value.trim();

      const password =
        document.getElementById("registerPassword").value;


      if (!name) {

        showMessage(
          "Please enter your name.",
          "error"
        );

        return;
      }


      if (!email) {

        showMessage(
          "Please enter your email.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      registerBtn.disabled = true;

      registerBtn.textContent = "Creating...";

      showMessage("");


      try {

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          result.user,
          {
            displayName: name
          }
        );


        showMessage(
          "Account created successfully!",
          "success"
        );


        setTimeout(function () {

          redirectUser(result.user);

        }, 700);


      } catch (error) {

        console.error(error);

        let msg =
          "Registration failed. Please try again.";


        if (
          error.code === "auth/email-already-in-use"
        ) {

          msg =
            "This email is already registered.";

        } else if (
          error.code === "auth/invalid-email"
        ) {

          msg =
            "Please enter a valid email.";

        } else if (
          error.code === "auth/weak-password"
        ) {

          msg =
            "Password must be at least 6 characters.";

        } else if (
          error.code === "auth/network-request-failed"
        ) {

          msg =
            "Network error. Check your internet.";

        }


        showMessage(msg, "error");

        registerBtn.disabled = false;

        registerBtn.textContent =
          "Create Account";

      }

    });

  </script>

</body>
</html>
