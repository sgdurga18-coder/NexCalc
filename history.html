<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#07070a">
    <meta name="description" content="NEXCALC calculation history">

    <title>NEXCALC — History</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, Helvetica, sans-serif;
        }

        :root {
            --bg: #07070a;
            --card: #111116;
            --card2: #181820;
            --text: #ffffff;
            --muted: #9898a7;
            --border: rgba(255,255,255,0.08);
            --accent: #7c5cff;
            --accent-light: #b8a9ff;
            --danger: #ff5c7a;
            --green: #35d49a;
        }

        body.light {
            --bg: #f5f5f8;
            --card: #ffffff;
            --card2: #eeeeF4;
            --text: #111116;
            --muted: #70707d;
            --border: rgba(0,0,0,0.08);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(124,92,255,0.18),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
            transition: 0.3s ease;
        }

        /* ================= HEADER ================= */

        header {
            height: 72px;
            padding: 0 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 100;

            border-bottom: 1px solid var(--border);

            background:
                rgba(7,7,10,0.78);

            backdrop-filter: blur(18px);
        }

        body.light header {
            background:
                rgba(255,255,255,0.82);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 21px;
            font-weight: 800;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #7c5cff,
                    #b39cff
                );

            box-shadow:
                0 8px 25px
                rgba(124,92,255,0.35);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--card);
            color: var(--text);

            cursor: pointer;
            font-size: 18px;

            transition: 0.2s;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            border-color:
                rgba(124,92,255,0.5);
        }

        /* ================= MAIN ================= */

        main {
            width: min(900px, 92%);
            margin: auto;

            padding:
                45px 0 120px;
        }

        .hero {
            text-align: center;
            margin-bottom: 32px;
        }

        .badge {
            display: inline-block;

            padding: 7px 14px;

            border-radius: 30px;

            background:
                rgba(124,92,255,0.1);

            border:
                1px solid
                rgba(124,92,255,0.35);

            color: var(--accent-light);

            font-size: 12px;
            font-weight: 700;

            margin-bottom: 15px;
        }

        .hero h1 {
            font-size:
                clamp(35px, 5vw, 52px);

            letter-spacing: -2px;
        }

        .gradient {
            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a893ff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            max-width: 600px;

            margin:
                13px auto 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.7;
        }

        /* ================= CONTROLS ================= */

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }

        .search {
            flex: 1;
            position: relative;
        }

        .search input {
            width: 100%;
            height: 50px;

            padding:
                0 18px 0 46px;

            border-radius: 14px;

            border:
                1px solid var(--border);

            outline: none;

            background: var(--card);
            color: var(--text);

            font-size: 14px;
        }

        .search input:focus {
            border-color:
                rgba(124,92,255,0.6);
        }

        .search-icon {
            position: absolute;

            left: 16px;
            top: 15px;

            opacity: 0.6;
        }

        .clear-button {
            height: 50px;

            padding:
                0 17px;

            border:
                1px solid
                rgba(255,92,122,0.25);

            border-radius: 14px;

            background:
                rgba(255,92,122,0.08);

            color: var(--danger);

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            white-space: nowrap;
        }

        .clear-button:hover {
            background:
                rgba(255,92,122,0.13);
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 25px;
        }

        .stat {
            padding: 18px;

            border:
                1px solid var(--border);

            border-radius: 17px;

            background: var(--card);
        }

        .stat small {
            color: var(--muted);
            font-size: 11px;
        }

        .stat strong {
            display: block;

            margin-top: 7px;

            font-size: 22px;
        }

        /* ================= HISTORY ================= */

        .history-card {
            border:
                1px solid var(--border);

            border-radius: 22px;

            background: var(--card);

            overflow: hidden;
        }

        .history-header {
            padding: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom:
                1px solid var(--border);
        }

        .history-header h2 {
            font-size: 18px;
        }

        .history-header span {
            color: var(--muted);
            font-size: 11px;
        }

        #historyList {
            min-height: 300px;
        }

        .history-item {
            padding: 19px 20px;

            border-bottom:
                1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            transition: 0.2s;
        }

        .history-item:hover {
            background:
                rgba(124,92,255,0.035);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .calculation {
            min-width: 0;
        }

        .calculation-expression {
            color: var(--muted);

            font-size: 13px;

            overflow-wrap: anywhere;
        }

        .calculation-result {
            margin-top: 6px;

            font-size: 21px;
            font-weight: 700;

            overflow-wrap: anywhere;
        }

        .calculation-date {
            margin-top: 7px;

            color: var(--muted);

            font-size: 10px;
        }

        .history-actions {
            display: flex;
            gap: 7px;
            flex-shrink: 0;
        }

        .small-btn {
            width: 38px;
            height: 38px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--card2);
            color: var(--text);

            cursor: pointer;

            transition: 0.2s;
        }

        .small-btn:hover {
            border-color:
                rgba(124,92,255,0.45);
        }

        .small-btn.delete:hover {
            color: var(--danger);

            border-color:
                rgba(255,92,122,0.4);
        }

        /* ================= EMPTY ================= */

        .empty {
            min-height: 300px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 30px;
        }

        .empty-icon {
            width: 70px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                rgba(124,92,255,0.1);

            font-size: 30px;

            margin-bottom: 17px;
        }

        .empty h3 {
            font-size: 18px;
        }

        .empty p {
            max-width: 400px;

            margin-top: 8px;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.6;
        }

        .start-button {
            margin-top: 18px;

            padding:
                12px 18px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #7c5cff,
                    #6241e8
                );

            color: white;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            padding:
                25px 20px 100px;

            color: var(--muted);

            font-size: 12px;
        }

        footer strong {
            color: var(--text);
        }

        /* ================= NAV ================= */

        .bottom-nav {
            position: fixed;

            bottom: 15px;
            left: 50%;

            transform:
                translateX(-50%);

            width: min(500px, 92%);

            height: 65px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            border:
                1px solid var(--border);

            border-radius: 20px;

            background:
                rgba(17,17,22,0.9);

            backdrop-filter: blur(20px);

            z-index: 200;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.3);
        }

        body.light .bottom-nav {
            background:
                rgba(255,255,255,0.9);
        }

        .nav-item {
            border: none;

            background: transparent;

            color: var(--muted);

            cursor: pointer;

            font-size: 11px;
        }

        .nav-icon {
            display: block;

            font-size: 19px;

            margin-bottom: 4px;
        }

        .nav-item.active {
            color: var(--accent-light);
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 95px;

            transform:
                translate(-50%, 20px);

            padding:
                12px 18px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: #202028;
            color: white;

            font-size: 13px;

            opacity: 0;

            pointer-events: none;

            transition: 0.25s;

            z-index: 500;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            main {
                width: 94%;
                padding-top: 30px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .clear-button {
                width: 100%;
            }

            .stats {
                grid-template-columns:
                    1fr 1fr;
            }

            .stats .stat:last-child {
                grid-column:
                    span 2;
            }

            .history-item {
                align-items: flex-start;
            }

            .history-actions {
                flex-direction: column;
            }

        }
    </style>
</head>


<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            <div class="logo-icon">
                🧮
            </div>

            <span>NEXCALC</span>

        </div>


        <div class="header-actions">

            <button
                class="icon-btn"
                id="themeButton"
                onclick="toggleTheme()">

                ☀️

            </button>


            <button
                class="icon-btn"
                onclick="goHome()">

                🏠

            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main>

        <!-- HERO -->

        <section class="hero">

            <div class="badge">
                📜 CALCULATION HISTORY
            </div>


            <h1>
                Your
                <span class="gradient">
                    History.
                </span>
            </h1>


            <p>
                Keep track of your calculations.
                Your history is stored locally on this device.
            </p>

        </section>


        <!-- CONTROLS -->

        <div class="controls">

            <div class="search">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search your calculations..."
                    oninput="renderHistory()">

            </div>


            <button
                class="clear-button"
                onclick="clearAllHistory()">

                🗑 Clear All

            </button>

        </div>


        <!-- STATS -->

        <section class="stats">

            <div class="stat">

                <small>
                    TOTAL CALCULATIONS
                </small>

                <strong id="totalCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <small>
                    TODAY
                </small>

                <strong id="todayCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <small>
                    STORAGE
                </small>

                <strong>
                    Local
                </strong>

            </div>

        </section>


        <!-- HISTORY -->

        <section class="history-card">

            <div class="history-header">

                <h2>
                    Recent Calculations
                </h2>

                <span id="resultCount">
                    0 results
                </span>

            </div>


            <div id="historyList"></div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <strong>NEXCALC</strong>

        <br><br>

        Calculate. Change. See what happens.

        <br><br>

        © 2026 NEXCALC

    </footer>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            class="nav-item"
            onclick="goHome()">

            <span class="nav-icon">
                🧮
            </span>

            Calculator

        </button>


        <button
            class="nav-item"
            onclick="goTools()">

            <span class="nav-icon">
                🛠️
            </span>

            Tools

        </button>


        <button
            class="nav-item active">

            <span class="nav-icon">
                📜
            </span>

            History

        </button>


        <button
            class="nav-item"
            onclick="window.location.href='premium.html'">

            <span class="nav-icon">
                👑
            </span>

            Premium

        </button>

    </nav>


    <!-- TOAST -->

    <div
        class="toast"
        id="toast">
    </div>


    <!-- JAVASCRIPT -->

    <script>

        /* =====================================
           HISTORY STORAGE
        ===================================== */

        const HISTORY_KEY =
            "nexcalcHistory";


        function getHistory() {

            try {

                const stored = JSON.parse(
                    localStorage.getItem(HISTORY_KEY)
                ) || [];

                // Remove demo calculations from older versions.
                const cleaned = stored.filter(function(item) {
                    return !(
                        (item.expression === "250 × 4" && item.result === "1000") ||
                        (item.expression === "1500 + 275" && item.result === "1775") ||
                        (item.expression === "5000 − 850" && item.result === "4150")
                    );
                });

                if (cleaned.length !== stored.length) {
                    localStorage.setItem(
                        HISTORY_KEY,
                        JSON.stringify(cleaned)
                    );
                }

                return cleaned;

            } catch (error) {

                return [];

            }

        }


        function saveHistory(history) {

            localStorage.setItem(
                HISTORY_KEY,
                JSON.stringify(history)
            );

        }


        /* =====================================
           RENDER
        ===================================== */

        function renderHistory() {

            const history =
                getHistory();


            const search =
                document
                .getElementById(
                    "searchInput"
                )
                .value
                .toLowerCase()
                .trim();


            const filtered =
                history.filter(function(item) {

                    return (
                        item.expression
                            .toLowerCase()
                            .includes(search)

                        ||

                        item.result
                            .toLowerCase()
                            .includes(search)
                    );

                });


            updateStats(history);


            const list =
                document.getElementById(
                    "historyList"
                );


            document.getElementById(
                "resultCount"
            ).textContent =
                filtered.length +
                (
                    filtered.length === 1
                    ? " result"
                    : " results"
                );


            if (filtered.length === 0) {

                list.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📜
                        </div>

                        <h3>
                            No calculations found
                        </h3>

                        <p>
                            Your calculations will appear
                            here after you start using NEXCALC.
                        </p>

                        <button
                            class="start-button"
                            onclick="goHome()">

                            Start Calculating →

                        </button>

                    </div>

                `;

                return;

            }


            list.innerHTML =
                filtered.map(function(item) {

                    return `

                        <div class="history-item">

                            <div class="calculation">

                                <div
                                    class="calculation-expression">

                                    ${escapeHTML(
                                        item.expression
                                    )}

                                </div>

                                <div
                                    class="calculation-result">

                                    = ${escapeHTML(
                                        item.result
                                    )}

                                </div>

                                <div
                                    class="calculation-date">

                                    ${formatDate(
                                        item.date
                                    )}

                                </div>

                            </div>


                            <div class="history-actions">

                                <button
                                    class="small-btn"
                                    onclick="copyResult(
                                        '${escapeAttribute(
                                            item.result
                                        )}'
                                    )"
                                    title="Copy">

                                    📋

                                </button>


                                <button
                                    class="small-btn delete"
                                    onclick="deleteHistory(
                                        ${item.id}
                                    )"
                                    title="Delete">

                                    🗑

                                </button>

                            </div>

                        </div>

                    `;

                }).join("");

        }


        /* =====================================
           STATS
        ===================================== */

        function updateStats(history) {

            document.getElementById(
                "totalCount"
            ).textContent =
                history.length;


            const today =
                new Date();


            const todayString =
                today.toDateString();


            const todayCount =
                history.filter(function(item) {

                    return (
                        new Date(
                            item.date
                        ).toDateString()
                        ===
                        todayString
                    );

                }).length;


            document.getElementById(
                "todayCount"
            ).textContent =
                todayCount;

        }


        /* =====================================
           DELETE ONE
        ===================================== */

        function deleteHistory(id) {

            const history =
                getHistory();


            const updated =
                history.filter(function(item) {

                    return item.id !== id;

                });


            saveHistory(updated);

            renderHistory();

            showToast(
                "Calculation deleted."
            );

        }


        /* =====================================
           CLEAR ALL
        ===================================== */

        function clearAllHistory() {

            const history =
                getHistory();


            if (history.length === 0) {

                showToast(
                    "History is already empty."
                );

                return;

            }


            const confirmed =
                confirm(
                    "Delete all calculation history?"
                );


            if (!confirmed) {
                return;
            }


            localStorage.removeItem(
                HISTORY_KEY
            );


            renderHistory();


            showToast(
                "All history cleared."
            );

        }


        /* =====================================
           COPY
        ===================================== */

        async function copyResult(result) {

            try {

                await navigator.clipboard.writeText(
                    result
                );

                showToast(
                    "Result copied."
                );

            } catch (error) {

                showToast(
                    "Could not copy result."
                );

            }

        }


        /* =====================================
           DATE FORMAT
        ===================================== */

        function formatDate(dateString) {

            const date =
                new Date(dateString);


            const now =
                new Date();


            const difference =
                now - date;


            const minute =
                60000;

            const hour =
                minute * 60;

            const day =
                hour * 24;


            if (difference < minute) {

                return "Just now";

            }


            if (difference < hour) {

                return Math.floor(
                    difference / minute
                ) + " min ago";

            }


            if (difference < day) {

                return Math.floor(
                    difference / hour
                ) + " hours ago";

            }


            return date.toLocaleString(
                undefined,
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric",
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

        }


        /* =====================================
           SECURITY HELPERS
        ===================================== */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function escapeAttribute(value) {

            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        /* =====================================
           THEME
        ===================================== */

        function toggleTheme() {

            document.body.classList.toggle(
                "light"
            );


            const button =
                document.getElementById(
                    "themeButton"
                );


            if (
                document.body.classList.contains(
                    "light"
                )
            ) {

                button.textContent =
                    "🌙";

                localStorage.setItem(
                    "nexcalcTheme",
                    "light"
                );

            } else {

                button.textContent =
                    "☀️";

                localStorage.setItem(
                    "nexcalcTheme",
                    "dark"
                );

            }

        }


        function loadTheme() {

            const theme =
                localStorage.getItem(
                    "nexcalcTheme"
                );


            if (theme === "light") {

                document.body.classList.add(
                    "light"
                );

                document.getElementById(
                    "themeButton"
                ).textContent =
                    "🌙";

            }

        }


        /* =====================================
           NAVIGATION
        ===================================== */

        function goHome() {

            window.location.href =
                "index.html";

        }


        function goTools() {

            window.location.href =
                "tools.html";

        }


        /* =====================================
           TOAST
        ===================================== */

        let toastTimer;


        function showToast(message) {

            const toast =
                document.getElementById(
                    "toast"
                );


            toast.textContent =
                message;


            toast.classList.add(
                "show"
            );


            clearTimeout(
                toastTimer
            );


            toastTimer =
                setTimeout(function() {

                    toast.classList.remove(
                        "show"
                    );

                }, 2500);

        }


        /* =====================================
           START
        ===================================== */

        loadTheme();

        renderHistory();

    </script>

</body>
</html>
